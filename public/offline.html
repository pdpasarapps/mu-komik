<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f2">
    <title>mu-komik — sedang offline</title>
    <style>
      :root{color-scheme:light;--ink:#1e2524;--paper:#f7f6f2;--mint:#b9ded0;--orange:#f26b43}
      *{box-sizing:border-box}
      body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      main{width:min(100%,440px);padding:34px;border-radius:18px;background:#fff;box-shadow:0 18px 50px #1e252414}
      img{width:60px;height:60px}
      h1{margin:22px 0 10px;font-size:2rem;line-height:1;letter-spacing:-.06em}
      p{color:#68716a;font-size:.94rem;line-height:1.65}
      button{min-height:46px;margin-top:12px;padding:0 18px;border:0;border-radius:8px;background:var(--ink);color:white;font-weight:750;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon.svg" alt="">
      <h1>Koneksi sedang terputus.</h1>
      <p>mu-komik perlu terhubung ke internet untuk memuat komik dan episode. Periksa koneksimu, lalu coba lagi.</p>
      <button onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
